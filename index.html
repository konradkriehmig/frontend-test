<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>monitor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-l">
        <span id="utcClock" class="clock-val">--:--:--</span>
        <span class="dx">UTC</span>
      </div>
      <div class="topbar-stats">
        <span><span id="txRate" class="bv">—</span><span class="dx"> tx/min</span></span>
        <span><span id="wikiRate" class="bv">—</span><span class="dx"> edits/min</span></span>
        <span><span id="flightStat" class="bv">—</span><span class="dx"> aircraft</span></span>
        <span><span id="quakeStat" class="bv">—</span><span class="dx"> quakes/hr</span></span>
        <span><span id="mempoolSize" class="bv">—</span><span class="dx"> mempool</span></span>
      </div>
      <div class="topbar-r dx" id="uptimeEl">up 0s</div>
    </header>

    <div class="ticker" id="ticker"></div>

    <main class="grid">
      <section class="panel p-crypto">
        <div class="ph">BINANCE SPOT <span class="dx" id="cryptoTs">—</span></div>
        <div class="crypto-grid" id="cryptoGrid"></div>
      </section>

      <section class="panel p-tx">
        <div class="ph">UNCONFIRMED BTC <span class="dx" id="txMeta">—</span></div>
        <ul class="stream" id="txFeed"></ul>
      </section>

      <section class="panel p-mempool">
        <div class="ph">MEMPOOL</div>
        <div class="kv" id="mempoolKV"></div>
        <div class="ph ph-sub">PENDING BLOCKS</div>
        <ul class="stream" id="blockFeed"></ul>
      </section>

      <section class="panel p-iss">
        <div class="ph">ISS <span class="dx" id="issCoords">—</span></div>
        <div class="kv" id="issKV"></div>
        <canvas id="issCanvas" width="340" height="120"></canvas>
      </section>

      <section class="panel p-quake">
        <div class="ph">SEISMIC <span class="dx" id="quakeMeta">—</span></div>
        <ul class="stream" id="quakeFeed"></ul>
      </section>

      <section class="panel p-flights">
        <div class="ph">AVIATION <span class="dx" id="flightMeta">—</span></div>
        <ul class="stream" id="flightFeed"></ul>
      </section>

      <section class="panel p-github">
        <div class="ph">GITHUB <span class="dx" id="githubMeta">—</span></div>
        <ul class="stream" id="githubFeed"></ul>
      </section>

      <section class="panel p-wiki">
        <div class="ph">WIKIPEDIA <span class="blink-dot" id="wikiDot">●</span> <span class="dx" id="wikiMeta">—</span></div>
        <ul class="stream tall" id="wikiFeed"></ul>
      </section>
    </main>

    <script src="/dashboard.js" defer></script>
  </body>
</html>
